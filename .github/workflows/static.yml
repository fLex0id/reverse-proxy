name: Static and orchestration regressions
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck pyflakes3 shfmt
      - run: python3 tools/static-check.py
      - run: python3 -m unittest discover -s tests -v
      - name: Formatting audit (legacy style; report only)
        run: shfmt -d rp.sh > shfmt.diff || test -s shfmt.diff
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-audit
          path: shfmt.diff
